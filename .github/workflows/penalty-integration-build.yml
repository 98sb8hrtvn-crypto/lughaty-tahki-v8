name: Penalty integration build check

on:
  push:
    branches:
      - feature/penalty-shootout-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production app and penalty page
        run: bun run build
