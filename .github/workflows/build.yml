name: Build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/penalty-shootout-integration, work/student-ready-ui-review]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production bundle
        run: bun run build
